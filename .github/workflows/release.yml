# GitHub Actions: release workflow for v0.1.0 onwards
#
# 🆕 v0.1.0 (A4) — auto-deploy to GitHub Packages on git tag push.
#
# Trigger: git tag matching `v*.*.*` (e.g. `v0.1.0`, `v1.2.0-rc1`)
#   git tag -a v0.1.0 -m "LingShu v0.1.0 release"
#   git push origin v0.1.0
#
# Auth: `GITHUB_TOKEN` (auto-generated by GH Actions, no PAT needed in CI).
# GH Packages URL: https://maven.pkg.github.com/lingshu-ai-agent/lingshu
#
# What it does:
#   1. checkout + JDK 17 setup
#   2. write a per-job ~/.m2/settings.xml with server id=github + GITHUB_TOKEN
#   3. run `mvn -B verify deploy` — install JAR + sources + javadoc + POM
#   4. publish to GH Packages (maven-deploy-plugin uses server id="github")
#
# Why no GPG:
#   - GitHub Packages does not require signed artifacts (unlike Maven Central).
#   - D2 decision (2026-10-06): keep friction minimal for v0.1.0; sign later
#     if downstream consumers ask for verification.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # e.g. v0.1.0, v1.2.3, v2.0.0-rc1

# Cancel in-flight runs for the same tag (idempotent re-tags)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read              # checkout
  packages: write             # push artifacts to GH Packages

jobs:
  deploy:
    name: mvn deploy → github packages
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so license:check can scan all files

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Write Maven settings.xml (server id=github + GITHUB_TOKEN)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>x-access-token</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Show deployment target
        run: |
          echo "deploy target = ${{ github.server_url }}/${{ github.repository_owner }}/lingshu"
          echo "tag           = ${GITHUB_REF_NAME}"
          echo "revision pom  ="
          grep -E '<revision>' pom.xml | head -1

      - name: Run license:check (L1 release gate — must be 100% coverage)
        run: mvn -B -N license:check

      - name: Build + verify + deploy
        # -DskipTests=false (default): CI re-runs full 766-test suite as a final gate
        # before deploy. Uses GITHUB_TOKEN env (substituted via ${env.GITHUB_TOKEN} in settings.xml).
        #
        # CRITICAL: do NOT use `mvn ... verify deploy` — `verify` and `deploy` are TWO
        # separate tasks in mvn's task model. Each task runs the default lifecycle from
        # validate up to its target phase, so source:jar-no-fork / javadoc:jar (bound to
        # package phase) fire TWICE → maven-deploy-plugin reports "We have duplicated
        # artifacts attached" at the second invocation. Verified 2026-10-07 with mvn -X:
        #   - Task "verify" → runs lifecycle through package (source:jar-no-fork fires)
        #   - Task "deploy" → runs lifecycle through package again (source:jar-no-fork
        #     fires AGAIN, finds sources.jar already attached → duplicate error)
        # `mvn clean deploy` alone runs the default lifecycle from validate through
        # verify → install → deploy in ONE pass — package phase fires once.
        run: mvn -B -DskipTests=false clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: success()
        run: |
          echo "## Release ${{ github.ref_name }} deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts pushed to GH Packages:" >> $GITHUB_STEP_SUMMARY
          echo "- https://github.com/${{ github.repository_owner }}/lingshu/packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Consumers can pull via:" >> $GITHUB_STEP_SUMMARY
          echo '```xml' >> $GITHUB_STEP_SUMMARY
          echo "<dependency>" >> $GITHUB_STEP_SUMMARY
          echo "  <groupId>ai.lingshu</groupId>" >> $GITHUB_STEP_SUMMARY
          echo "  <artifactId>lingshu-core</artifactId>" >> $GITHUB_STEP_SUMMARY
          echo "  <version>${{ github.ref_name }}</version>" >> $GITHUB_STEP_SUMMARY
          echo "</dependency>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Failure summary
        if: failure()
        run: |
          echo "## ❌ Release ${{ github.ref_name }} deploy failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow log above. Common causes:" >> $GITHUB_STEP_SUMMARY
          echo "- license:check failed (missing SPDX header on new files)" >> $GITHUB_STEP_SUMMARY
          echo "- test failure (mvn verify runs 766-test suite)" >> $GITHUB_STEP_SUMMARY
          echo "- GITHUB_TOKEN missing packages:write permission" >> $GITHUB_STEP_SUMMARY
          echo "- distributionManagement <id>github</id> mismatch with settings.xml server" >> $GITHUB_STEP_SUMMARY