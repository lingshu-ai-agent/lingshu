# demo-product — comprehensive HTTP SSE chat demo (Story #025)
# Phase 4: full configuration combining 8 features.

spring:
  application:
    name: demo-product
  main:
    banner-mode: off

server:
  port: 8080

# Logging tuned for demo: events visible, framework noise reduced.
logging:
  level:
    root: INFO
    ai.lingshu: INFO
    ai.lingshu.examples.demoproduct: INFO
    org.springframework.web: INFO

agent:
  # ── LLM provider (Anthropic-compatible, MiniMax endpoint) ─────────────
  # base-url + api-key are resolved by AnthropicLlmProviderProvider via
  # (1) ANTHROPIC_BASE_URL / ANTHROPIC_API_KEY env vars
  # (2) spring.ai.anthropic.base-url system property
  # (3) DEFAULT_BASE_URL = https://api.anthropic.com
  # Set env vars before `mvn spring-boot:run` for the demo to hit a real LLM.
  llm:
    provider: anthropic
    model: MiniMax-M3
    max-tokens: 2048
    temperature: 0.3

  # ── Identity / Instructions / Memory (Story #002) ──────────────────────
  identity:
    name: LingShu
    role: Interactive AI coding assistant
    language: zh
    traits:
      - concise
      - precise
      - file-aware
    tone: friendly

  instructions:
    file: ./prompts/system-product.md
    template-engine: mustache
    variables: {}
    # 🆕 v1.5.65 Story #053 — anti-verify-loop prompt clause (default-on).
    # Per 2026-10-18 user feedback ("如果不主动在用户Prompt上加限制还是会重复,
    # 说明 system prompt 不够啊"), the ANTI_VERIFY_LOOP_CLAUSE is now appended
    # by DEFAULT to the [INSTRUCTIONS] segment. Story #051 originally shipped
    # this as opt-in (`anti-verify-loop: true`) but off-by-default meant 99% of
    # users hit LLM's "write → verify → rewrite → verify" loops unknowingly —
    # the prompt is the primary defense, so default behavior flips to ON.
    # Opt-out escape hatch is preserved: explicitly set `anti-verify-loop: false`
    # below for evaluation harnesses / debug scenarios that intentionally
    # trigger verification loops. Stack on top of any inline/file INSTRUCTIONS
    # (clause is appended, not exclusive).
    # 🆕 v1.5.63 Story #051 — anti-verify-loop prompt clause (opt-in).
    # When `true`, DefaultPromptBuilder appends ANTI_VERIFY_LOOP_CLAUSE to the
    # [INSTRUCTIONS] segment telling the LLM to trust tool success and not
    # repeat read_file/list_dir against the same path. Off by default — enable
    # here if a model exhibits "write → verify → rewrite → verify" loops
    # (user-observed SSE trace, 2026-10-16). Stack on top of any inline
    # INSTRUCTIONS text (not exclusive).
    #
    # anti-verify-loop: false   # 🆕 v1.5.65 Story #053 — opt-out 反验证循环条款(默认已开启)

  memory:
    claude-md:
      enabled: true
      project: ./CLAUDE.md
      user: ~/.lingshu/CLAUDE.md

  # ── Session store (Story #014) ─────────────────────────────────────────
  # Slot 5 SessionStore provider name. `memory` (default) keeps all state
  # in-process; `file` persists each turn's Checkpoint to disk so it can
  # be reloaded across process restarts. The file backend stores
  # ${java.io.tmpdir}/lingshu-sessions/{tenant-or-"_default"}/{sessionId}.json
  # using an atomic write protocol (write-tmp + ATOMIC_MOVE) so partial
  # writes never leave a corrupt checkpoint on disk. Multi-tenant mode
  # reads TenantContext.current(); the demo runs single-tenant so files
  # land under the `_default/` subdirectory. Switch to `file` here to
  # exercise the new Slot 5 backend end-to-end via ChatController — turn
  # the demo off, restart, ask again, and history is restored.
  session-store: file

  # ── Skills (Story #020) — classpath SKILL.md auto-discovery ────────────
  skills:
    sources:
      - type: classpath
        location: skills

  # ── Tools (Story #019 built-in read/write, Story #025 custom bash_safe) ─
  # The four @Component Tools (read_file/write_file/list_dir/bash_safe) live
  # in ai.lingshu.examples.demoproduct.ProductTools and are auto-scanned via
  # Spring's @ComponentScan. We disable the engine's built-in bash tool so
  # the demo's whitelist (BashSafeTool) is the only shell path.
  #
  # 🆕 Story #029 — `allow-list` is the strict PermissionPolicy's allow-list
  # (dsh §5.5 L2168-2189). When `permission-policy: strict`, only tools named
  # here can be invoked; everything else is denied with `[LINGS-P01]`.
  #
  # 🆕 Story #031 — pattern matching replaces the Story #029 static 12-line
  # enumeration. The yml entry below uses `*` (the wildcard pattern) so the
  # strict policy allows ALL registered Tools regardless of source category
  # (local / mcp / skill / a2a / delegate). New MCP servers / Skill files /
  # RemoteAgents / Delegate sub-agents are auto-included without yml edits.
  # Other supported patterns (PermissionPatterns.matches):
  #   - "<exact-name>"           → strict-equals tool.name()
  #   - "<category>:*"           → every tool whose Tool.sourceCategory() matches
  #   - "*"                      → every tool (used here)
  # See `lingshu-core/src/main/java/ai/lingshu/core/impl/permission/PermissionPatterns.java`
  # + dsh §4.7 + §15.4 P 段.
  tools:
    enabled: true
    read: true
    write: true
    edit: false
    bash: false
    max-file-bytes: 65536
    # 🆕 Story #031 — wildcard pattern (replaces Story #029 12-line static list).
    # When permission-policy: strict (below), every registered Tool is allowed
    # by name regardless of category. New MCP servers / Skills / RemoteAgents
    # added after this yml edit are auto-included.
    allow-list:
      - "*"
    deny-list: []
    # 🆕 Story #030 — ask-list: when permission-policy: ask (set below), tools
    # matching any pattern here pause the turn and emit AgentEvent.ApprovalRequired;
    # the host UI delivers the human's answer via POST /api/approvals/{sessionId}/{approvalId}.
    # Demo entry points write_file + bash_safe — both are "scary" enough to merit
    # approval but not "deny-by-default" (i.e. read_file is auto-allowed via the
    # wildcard allow-list above). For a tighter demo set `permission-policy: ask`
    # below and switch to ask-list-only.
    ask-list:
      - "write_file"
      - "bash_safe"

  # ── Sandbox (Slot 3) — boundary for the 4 fs-touching Tools ──────────
  # demo-product enables 4 local @Component Tools (read_file/write_file/
  # list_dir/bash_safe in ProductTools.java). The sandbox policy is the
  # *primary* boundary (per the class Javadoc); Tool-level checks (maxBytes,
  # BashSafeTool whitelist) are defence in depth.
  #
  # Schema (5 fields, dsh §5623-5627) — matches AgentConfig.Sandbox:
  #   policy              → PermissionPolicy (strict / default)
  #   runtime             → RuntimeSandbox (chroot default)
  #   working-directory   → fs ops must resolve under this Path
  #   command-whitelist   → only enforced when built-in bash=true (here: false,
  #                           BashSafeTool enforces its own whitelist instead)
  #   domain-whitelist    → 🆕 Story #032 — enforced by WebFetchTool via
  #                           ctx.http().get(url) → WhitelistedHttpClient.check().
  #                           Built-in web_fetch Tool is GET-only; HTTPS transparent.
  #
  # Consumed by the `agentConfig(Environment)` @Bean (Story #025 follow-up).
  # ChatController builds per-session configs from defaults directly —
  # same pre-existing limitation as mcp/a2a here.
  sandbox:
    policy: default
    runtime: chroot
    working-directory: ${user.dir}
    command-whitelist:
      - ls
      - cat
      - echo
      - head
      - tail
      - wc
      - date
      - uname
      - whoami
      - pwd
      - which
    # 🆕 Story #032 — domain-whitelist now enforced for local web_fetch Tool
    # (Claude Code parity, Read/Bash/WebFetch triplet complete); HTTPS supported
    # transparently. The local Tool path goes through WhitelistedHttpClient,
    # which checks the host against this list before opening any connection;
    # domain miss → [LINGS-S01] AccessDeniedException → ToolResult.error.
    #
    # MCP HTTP transports stay untouched per Story #033 Path B (check-only hook).
    #
    # `localhost` is included so the Story #032 L3 blackbox IT can hit a mock
    # HTTP server started in-test (DemoProductWebFetchIT). Remove for prod.
    domain-whitelist:
      - github.com
      - maven.aliyun.com
      - api.openai.com
      - api.anthropic.com
      - raw.githubusercontent.com
      - huggingface.co
      - localhost

  # ── MCP (Story #021a/b/c) — all 3 transports wired ────────────────────
  # Each server gets its own `name` + `transport` + matching fields. The
  # McpServerConnectionFactory dispatches on `transport`:
  #   STDIO          → spawn command + speak JSON-RPC over stdin/stdout
  #   SSE            → long-lived HTTP GET for server-pushed events
  #   STREAMABLE_HTTP → stateless POST request/response
  #
  # stdio server below is real and self-contained (echo-stdio.py ships in
  # src/main/resources/mcp-servers/). SSE and streamable_http point to
  # localhost URLs — replace with a real MCP server (e.g. the official
  # `mcp-server-everything` reference server) to see them live. McpTransport
  # logs the connect failure once and then backs off (1s→2s→4s→...→60s cap),
  # so boot is never blocked.
  mcp:
    servers:
      # ── 1. STDIO — real, working out of the box ────────────────────────
      - name: echo-stdio
        transport: stdio
        command: python3
        args:
          - src/main/resources/mcp-servers/echo-stdio.py
        # env: {}        # uncomment + customize env if your server needs it
        heartbeat-interval-ms: 30000
        heartbeat-timeout-ms: 10000
        reconnect-cap-ms: 60000

      # ── 2. SSE — 官方参考服务器 `server-everything`(HTTP+SSE 传输)─────
      # 启动:  npx -y @modelcontextprotocol/server-everything sse
      # 默认监听 :3001。客户端用 `url` 拼出长连接 GET /sse,然后按服务端下发的
      # `event: endpoint` 拿到 POST URI 再发 initialize / tools/list,响应从流上
      # 按 JSON-RPC id 匹配。`url` 写 base 即可(带不带 /sse 都能识别)。
      - name: everything-sse
        transport: sse
        url: http://localhost:3001
        domain-whitelist:
          - localhost
          - 127.0.0.1
        heartbeat-interval-ms: 30000
        heartbeat-timeout-ms: 10000
        reconnect-cap-ms: 60000

      # ── 3. STREAMABLE_HTTP — 官方参考服务器 `server-everything` ────────
      # 启动(与 SSE 并存,用 PORT 覆盖到 3002):
      #   set PORT=3002 & npx -y @modelcontextprotocol/server-everything streamableHttp
      # 规范要求单一 MCP endpoint:所有 JSON-RPC 消息都 POST 到 /mcp 本身,
      # 服务端返回 Mcp-Session-Id,后续请求回传该头;响应可能是 application/json
      # 或 text/event-stream,客户端两种都解析。心跳用 JSON-RPC ping。
      - name: everything-streamable
        transport: streamable_http
        url: http://localhost:3002/mcp
        domain-whitelist:
          - localhost
          - 127.0.0.1
        heartbeat-interval-ms: 30000
        heartbeat-timeout-ms: 10000
        reconnect-cap-ms: 60000

  # ── A2A (Story #009 + #009d + 🆕 #025b) — remote agents list ────────────
  # DemoProductApplication.agentConfig(Environment) walks this list and
  # populates AgentConfig.A2a.remoteAgents. RemoteAgentTool.description()
  # then fetches each agent's AgentCard from `url/.well-known/agent.json`
  # and surfaces the skill ids into the LLM's tool list. When the LLM
  # emits a tool call with {agentName, skill, input}, RemoteAgentTool
  # routes it to A2aTransport.submit → POST /rpc message/send.
  #
  # Pairs with the sibling module demo-product-a2a-server (port 9090)
  # which exposes the `translator` agent advertising the `translate` skill.
  # Boot order: start demo-product-a2a-server FIRST so its AgentCard is
  # reachable when demo-product starts up.
  #
  # Why `http-base-url: http://localhost:9090` — HttpJsonRpcA2aTransport
  # uses a transport-wide `httpBaseUrl` (one Transport Bean, one base URL),
  # NOT per-agentRef URL. All remote agents are fetched/dispatched via the
  # same base URL. To reach a multi-agent gateway, set this to the gateway
  # URL; for our 1-translator demo it's the a2a-server's own URL.
  a2a:
    transport: http-jsonrpc-1.0.0
    http-base-url: http://localhost:9090
    remote-agents:
      - name: translator
        url: http://localhost:9090
        priority: 10
    description-skill-limit: 10

  # ── Delegate sub-agents (Story #023) — explore / engineer / reviewer ──
  delegate:
    prompts-dir: ./prompts
    types:
      explore:
        llm: { provider: anthropic, model: MiniMax-M3, max-tokens: 1024 }
        tools: [read_file, list_dir]
        sandbox:
          policy: default
          runtime: chroot
          workingDirectory: ${user.dir}
      engineer:
        llm: { provider: anthropic, model: MiniMax-M3, max-tokens: 2048 }
        tools: [read_file, write_file, list_dir, bash_safe]
        sandbox:
          policy: default
          runtime: chroot
          workingDirectory: ${user.dir}
      reviewer:
        llm: { provider: anthropic, model: MiniMax-M3, max-tokens: 1024 }
        tools: [read_file]
        sandbox:
          policy: default
          runtime: chroot
          workingDirectory: ${user.dir}

  # ── Compactor (Story #018) — low threshold so the demo triggers it ────
  compactor:
    name: truncating
    max-tool-result-bytes: 512
    max-prompt-tokens: 1000
    keep-recent-turns: 3

  # ── Loop tuning ────────────────────────────────────────────────────────
  react-max-steps: 30
  tool-parallelism: 4
  turn-timeout-seconds: 120
  llm-timeout-seconds: 30
  tool-timeout-seconds: 30
  # 🆕 Story #030 — Approval timeout. `0` (zero-config default) means wait
  # indefinitely so an overnight approval still works when the human returns
  # next morning (matches Claude Code's behavior). Set >0 to bound the wait;
  # timeout triggers Decision.Deny with [LINGS-P02] embedded. The demo leaves
  # it at 0 so testers can verify the indefinite-wait behavior end-to-end.
  approval-timeout: 0

  # 🆕 Story #029 / #030 / #031 — PermissionPolicy provider name. Switches
  # Slot 4 router target. `ask` mode is the strict-mode SUPERSET (see
  # AskUserPermissionPolicy.check() 5-段决策, short-circuit on first match):
  #   `default` = AllowAllPermissionPolicy  (zero-config back-compat, Story #001).
  #   `strict`  = StrictPermissionPolicy     (deny-list + allow-list only).
  #   `ask`     = AskUserPermissionPolicy    (deny-list → ask-list → allow-list).
  #
  # Demo config below activates `ask` so write_file + bash_safe (in
  # tools.ask-list above) pause the turn and emit AgentEvent.ApprovalRequired;
  # the host UI delivers the human's answer via
  # POST /api/approvals/{sessionId}/{approvalId}. `approval-timeout: 0` above
  # means wait indefinitely (overnight parity with Claude Code).
  #
  # Expected per-tool behaviour in `ask` mode:
  #   - write_file, bash_safe   → AskUser  (path 2 of AskUserPermissionPolicy)
  #   - read_file, list_dir,    → Allow    (path 4 — `*` wildcard allow-list)
  #     any MCP/skill/a2a/delegate tool
  #   - anything in deny-list   → Deny     (path 1 — currently empty)
  # See dsh §4.7 + §5.5 + §15.4 P 段 + lingshu-core PermissionPatterns.matches.
  permission-policy: ask